name: One-shot chord support

on:
  push:
    branches:
      - codex/browser-github-pages
    paths:
      - .github/workflows/one-shot-chord-support.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Implement ordered chord support
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 occurrence, found {count}')
              return text.replace(old, new)

          data_path = Path('src/renderer/data.js')
          data = data_path.read_text(encoding='utf-8')
          data = replace_once(
              data,
              "        { id: 10, a: 'Закрыть редактор', k: ['Ctrl', 'F4'], d: 'easy' },\n        { id: 12, a: 'Восстановить закрытый', k: ['Ctrl', 'Shift', 'T'], d: 'medium' },",
              "        { id: 10, a: 'Закрыть редактор', k: ['Ctrl', 'F4'], d: 'easy' },\n        { id: 11, a: 'Закрыть все', k: ['Ctrl', 'K'], steps: [['Ctrl', 'K'], ['Ctrl', 'W']], d: 'medium' },\n        { id: 12, a: 'Восстановить закрытый', k: ['Ctrl', 'Shift', 'T'], d: 'medium' },",
              'restore VS Code close-all chord',
          )
          data = replace_once(
              data,
              "        { id: 41, a: 'Форматировать документ', k: ['Shift', 'Alt', 'F'], d: 'medium' },\n        { id: 43, a: 'Комментарий строки', k: ['Ctrl', '/'], d: 'easy' },",
              "        { id: 41, a: 'Форматировать документ', k: ['Shift', 'Alt', 'F'], d: 'medium' },\n        { id: 42, a: 'Форматировать выделение', k: ['Ctrl', 'K'], steps: [['Ctrl', 'K'], ['Ctrl', 'F']], d: 'hard' },\n        { id: 43, a: 'Комментарий строки', k: ['Ctrl', '/'], d: 'easy' },",
              'restore VS Code format-selection chord',
          )
          data_path.write_text(data, encoding='utf-8')

          logic_path = Path('src/renderer/logic.js')
          logic = logic_path.read_text(encoding='utf-8')
          logic = replace_once(
              logic,
              "\n  function shuffle(list, rng = Math.random) {",
              "\n  function shortcutSteps(shortcut) {\n    if (shortcut && Array.isArray(shortcut.steps) && shortcut.steps.length) {\n      return shortcut.steps.map((step) => step.slice());\n    }\n    return [shortcut && Array.isArray(shortcut.k) ? shortcut.k.slice() : []];\n  }\n\n  function shuffle(list, rng = Math.random) {",
              'add shortcutSteps',
          )
          logic = replace_once(
              logic,
              "  return {\n    normalizeKey,\n    compareKeySets,\n    shuffle,\n  };",
              "  return {\n    normalizeKey,\n    compareKeySets,\n    shortcutSteps,\n    shuffle,\n  };",
              'export shortcutSteps',
          )
          logic_path.write_text(logic, encoding='utf-8')

          app_path = Path('src/renderer/app.js')
          app = app_path.read_text(encoding='utf-8')
          app = replace_once(
              app,
              "  let qz = null, down = new Set(), reset = false, tick = null, flash = '', lastEsc = 0;",
              "  let qz = null, down = new Set(), reset = false, tick = null, chordTick = null, flash = '', lastEsc = 0;",
              'add chord timer state',
          )
          app = replace_once(
              app,
              "  const catList = () => ['all', ...(cats[sel] || [])];",
              "  const modifierKeys = new Set(['Ctrl', 'Shift', 'Alt', 'Win']);\n  const shortcutSteps = (shortcut) => l.shortcutSteps(shortcut);\n  const chordHtml = (steps) => steps.map((step) => combo(step)).join('<span class=\"chord-sep\" aria-hidden=\"true\">→</span>');\n  const shortcutCombo = (shortcut) => chordHtml(shortcutSteps(shortcut));\n  const answerCombo = (steps) => chordHtml((steps || []).filter((step) => Array.isArray(step) && step.length));\n  const catList = () => ['all', ...(cats[sel] || [])];",
              'add chord rendering helpers',
          )
          app = replace_once(
              app,
              "<span class=\"keys\">${combo(s.k)}</span>",
              "<span class=\"keys\">${shortcutCombo(s)}</span>",
              'render study chords',
          )
          app = replace_once(
              app,
              "    qz = { qs: l.shuffle(qs).slice(0, clamp(cnt, qs.length)), i: 0, c: 0, k: [], left: timerSec, mistakes: [], ok: [], skipped: [], mode };",
              "    qz = { qs: l.shuffle(qs).slice(0, clamp(cnt, qs.length)), i: 0, c: 0, k: [], step: 0, entered: [], stepMatched: false, left: timerSec, mistakes: [], ok: [], skipped: [], mode };",
              'initialize chord quiz state',
          )
          app = replace_once(
              app,
              "    clearInterval(tick);\n    if (timerOn)",
              "    clearInterval(tick);\n    clearTimeout(chordTick); chordTick = null;\n    if (timerOn)",
              'clear chord timer on start',
          )
          app = replace_once(
              app,
              "  function finish() {\n    clearInterval(tick); tick = null; view = 'results'; render();\n  }",
              "  function finish() {\n    clearInterval(tick); tick = null;\n    clearTimeout(chordTick); chordTick = null;\n    view = 'results'; render();\n  }",
              'clear chord timer on finish',
          )
          app = replace_once(
              app,
              "  function goNext(delay = 0) { setTimeout(() => { if (!qz) return; qz.i += 1; qz.k = []; down = new Set(); reset = false; flash = ''; if (qz.i >= qz.qs.length) finish(); else render(); }, delay); }\n  function pass(keys) { if (!qz || !cur()) return; qz.k = keys.slice(); qz.c += 1; qz.ok.push(cur()); flash = 'ok'; render(); goNext(650); }\n  function fail(keys, skip) { if (!qz || !cur()) return; qz.mistakes.push({ q: cur(), got: keys.slice(), skip: !!skip }); qz.skipped.push(cur()); if (skip) goNext(0); else { flash = 'bad'; render(); goNext(250); } }\n  function check(keys) { l.compareKeySets(keys, cur().k) ? pass(keys) : fail(keys, false); }",
              "  function goNext(delay = 0) { setTimeout(() => { if (!qz) return; qz.i += 1; qz.k = []; qz.step = 0; qz.entered = []; qz.stepMatched = false; down = new Set(); reset = false; flash = ''; clearTimeout(chordTick); chordTick = null; if (qz.i >= qz.qs.length) finish(); else render(); }, delay); }\n  function pass() { if (!qz || !cur()) return; clearTimeout(chordTick); chordTick = null; qz.c += 1; qz.ok.push(cur()); flash = 'ok'; render(); goNext(650); }\n  function fail(steps, skip) { if (!qz || !cur()) return; clearTimeout(chordTick); chordTick = null; qz.mistakes.push({ q: cur(), got: (steps || []).map((step) => step.slice()), skip: !!skip }); qz.skipped.push(cur()); if (skip) goNext(0); else { flash = 'bad'; render(); goNext(250); } }\n  function currentSteps() { return cur() ? shortcutSteps(cur()) : []; }\n  function checkChoice(id) { const selected = progs[sel].sc.find((s) => String(s.id) === String(id)); if (!selected || !cur()) return; selected.id === cur().id ? pass() : fail(shortcutSteps(selected), false); }\n  function advanceChord() {\n    if (!qz || !cur()) return;\n    const steps = currentSteps();\n    const matched = steps[qz.step];\n    if (!matched || qz.step >= steps.length - 1) return;\n    qz.entered.push(matched.slice());\n    qz.step += 1;\n    qz.k = Array.from(down);\n    qz.stepMatched = false;\n    clearTimeout(chordTick);\n    chordTick = setTimeout(() => {\n      if (view !== 'quiz' || !qz) return;\n      qz.step = 0; qz.entered = []; qz.stepMatched = false; qz.k = Array.from(down);\n      render();\n    }, 2000);\n    render();\n  }",
              'replace flat answer state with chord state',
          )
          app = replace_once(
              app,
              "  function choices(c) {\n    return l.shuffle([c, ...l.shuffle(progs[sel].sc.filter((s) => s.id !== c.id)).slice(0, 3)]).map((s) => `<button class=\"choice\" data-choice=\"${esc(s.k.join(' + '))}\">${combo(s.k)}</button>`).join('');\n  }",
              "  function choices(c) {\n    return l.shuffle([c, ...l.shuffle(progs[sel].sc.filter((s) => s.id !== c.id)).slice(0, 3)]).map((s) => `<button class=\"choice\" data-choice-id=\"${s.id}\">${shortcutCombo(s)}</button>`).join('');\n  }",
              'make choice mode chord-safe',
          )
          app = replace_once(
              app,
              "  function quizH() {\n    const c = cur();\n    if (!qz || !c) return resultsH();\n    return `<section class=\"page narrow\"><div class=\"quizTop\"><button class=\"back\" data-quit aria-label=\"Завершить\">←</button><span>${qz.i + 1}/${qz.qs.length}</span>${timerOn ? `<b>${fmt(qz.left)}</b>` : '<b></b>'}</div><div class=\"quiz ${flash}\" style=\"--c:${meta().c}\"><p>Удерживайте нужные клавиши</p><h1>${esc(c.a)}</h1>${qz.mode === 'choice' ? `<div class=\"choices\">${choices(c)}</div>` : `<div class=\"inputKeys\">${qz.k.length ? combo(qz.k) : '<span>Ожидание ввода</span>'}</div>`}<button class=\"skip\" data-skip aria-label=\"Пропустить\">×</button></div></section>`;\n  }",
              "  function quizH() {\n    const c = cur();\n    if (!qz || !c) return resultsH();\n    const steps = currentSteps();\n    const entered = [...qz.entered, ...(qz.k.length ? [qz.k] : [])];\n    const prompt = steps.length > 1 ? `Шаг ${Math.min(qz.step + 1, steps.length)} из ${steps.length}` : 'Удерживайте нужные клавиши';\n    return `<section class=\"page narrow\"><div class=\"quizTop\"><button class=\"back\" data-quit aria-label=\"Завершить\">←</button><span>${qz.i + 1}/${qz.qs.length}</span>${timerOn ? `<b>${fmt(qz.left)}</b>` : '<b></b>'}</div><div class=\"quiz ${flash}\" style=\"--c:${meta().c}\"><p>${prompt}</p><h1>${esc(c.a)}</h1>${qz.mode === 'choice' ? `<div class=\"choices\">${choices(c)}</div>` : `<div class=\"inputKeys\">${entered.length ? answerCombo(entered) : '<span>Ожидание ввода</span>'}</div>`}<button class=\"skip\" data-skip aria-label=\"Пропустить\">×</button></div></section>`;\n  }",
              'render chord quiz progress',
          )
          app = replace_once(
              app,
              "${m.skip ? 'Пропущено' : combo(m.got)}</span><b>${combo(m.q.k)}</b>",
              "${m.skip ? 'Пропущено' : answerCombo(m.got)}</span><b>${shortcutCombo(m.q)}</b>",
              'render chord results',
          )
          app = replace_once(
              app,
              "    if (t.dataset.choice) check(t.dataset.choice.split(' + '));",
              "    if (t.dataset.choiceId) checkChoice(t.dataset.choiceId);",
              'handle chord-safe choices',
          )
          app = replace_once(
              app,
              "  document.addEventListener('keydown', (e) => {\n    if (view !== 'quiz' || !qz || qz.mode === 'choice' || flash) return;\n    const k = l.normalizeKey(e.key, e.code); if (!k) return;\n    e.preventDefault();\n    if (k === 'Esc') {\n      const now = Date.now();\n      if (now - lastEsc < 1200 && confirm('Вы уверены, что хотите завершить тренировку?')) finish();\n      lastEsc = now;\n    }\n    if (reset) { qz.k = []; down = new Set(); reset = false; }\n    down.add(k); qz.k = Array.from(down); render();\n    if (cur() && l.compareKeySets(qz.k, cur().k)) pass(qz.k);\n  });\n\n  document.addEventListener('keyup', (e) => {\n    if (view !== 'quiz' || !qz || qz.mode === 'choice' || flash) return;\n    const k = l.normalizeKey(e.key, e.code);\n    down.delete(k);\n    if (!down.size && qz.k.length) reset = true;\n  });",
              "  document.addEventListener('keydown', (e) => {\n    if (view !== 'quiz' || !qz || qz.mode === 'choice' || flash) return;\n    const k = l.normalizeKey(e.key, e.code); if (!k) return;\n    e.preventDefault();\n    if (e.repeat) return;\n    if (k === 'Esc') {\n      const now = Date.now();\n      if (now - lastEsc < 1200 && confirm('Вы уверены, что хотите завершить тренировку?')) { finish(); return; }\n      lastEsc = now;\n    }\n    if (reset) { qz.k = []; down = new Set(); reset = false; }\n    down.add(k); qz.k = Array.from(down);\n    const steps = currentSteps();\n    const expected = steps[qz.step] || steps[0];\n    if (expected && l.compareKeySets(qz.k, expected)) {\n      if (qz.step >= steps.length - 1) { pass(); return; }\n      qz.stepMatched = true;\n    }\n    render();\n  });\n\n  document.addEventListener('keyup', (e) => {\n    if (view !== 'quiz' || !qz || qz.mode === 'choice' || flash) return;\n    const k = l.normalizeKey(e.key, e.code);\n    down.delete(k);\n    qz.k = Array.from(down);\n    if (qz.stepMatched && qz.k.every((key) => modifierKeys.has(key))) { advanceChord(); return; }\n    if (!down.size && qz.step === 0) reset = true;\n    render();\n  });",
              'support ordered chord key capture',
          )
          app_path.write_text(app, encoding='utf-8')

          data_test_path = Path('tests/data.test.cjs')
          data_test = data_test_path.read_text(encoding='utf-8')
          data_test = replace_once(
              data_test,
              "      for (const key of shortcut.k) {\n        assert.equal(typeof key, 'string');\n        assert.ok(key.trim(), `${programId}/${shortcut.id}: empty key token`);\n      }\n      assert.ok(difficulties.has(shortcut.d), `${programId}/${shortcut.id}: invalid difficulty ${shortcut.d}`);",
              "      for (const key of shortcut.k) {\n        assert.equal(typeof key, 'string');\n        assert.ok(key.trim(), `${programId}/${shortcut.id}: empty key token`);\n      }\n      if (shortcut.steps !== undefined) {\n        assert.ok(Array.isArray(shortcut.steps) && shortcut.steps.length > 1, `${programId}/${shortcut.id}: invalid chord steps`);\n        assert.deepEqual(shortcut.steps[0], shortcut.k, `${programId}/${shortcut.id}: k must match first chord step`);\n        for (const step of shortcut.steps) {\n          assert.ok(Array.isArray(step) && step.length > 0, `${programId}/${shortcut.id}: empty chord step`);\n          for (const key of step) {\n            assert.equal(typeof key, 'string');\n            assert.ok(key.trim(), `${programId}/${shortcut.id}: empty chord key token`);\n          }\n        }\n      }\n      assert.ok(difficulties.has(shortcut.d), `${programId}/${shortcut.id}: invalid difficulty ${shortcut.d}`);",
              'validate optional chord steps',
          )
          data_test_path.write_text(data_test, encoding='utf-8')

          logic_test_path = Path('tests/logic.test.cjs')
          logic_test = logic_test_path.read_text(encoding='utf-8')
          logic_test += "\ntest('shortcutSteps keeps flat shortcuts backward-compatible and clones ordered chords', () => {\n  const flat = { k: ['Ctrl', 'P'] };\n  const chord = { k: ['Ctrl', 'K'], steps: [['Ctrl', 'K'], ['Ctrl', 'W']] };\n  const flatSteps = hkLogic.shortcutSteps(flat);\n  const chordSteps = hkLogic.shortcutSteps(chord);\n  assert.deepEqual(flatSteps, [['Ctrl', 'P']]);\n  assert.deepEqual(chordSteps, [['Ctrl', 'K'], ['Ctrl', 'W']]);\n  chordSteps[0][0] = 'Alt';\n  assert.equal(chord.steps[0][0], 'Ctrl');\n});\n"
          logic_test_path.write_text(logic_test, encoding='utf-8')

          verified_path = Path('tests/verified-shortcuts.test.cjs')
          verified = verified_path.read_text(encoding='utf-8')
          verified = replace_once(
              verified,
              "test('verified VS Code Windows defaults stay aligned and unsupported chords stay excluded', () => {\n  assert.deepEqual(shortcut('vscode', 4).k, ['Alt', 'F4']);\n  assert.deepEqual(shortcut('vscode', 10).k, ['Ctrl', 'F4']);\n  assert.equal(maybeShortcut('vscode', 11), undefined);\n  assert.equal(maybeShortcut('vscode', 42), undefined);\n});",
              "test('verified VS Code Windows defaults and ordered chords stay aligned', () => {\n  assert.deepEqual(shortcut('vscode', 4).k, ['Alt', 'F4']);\n  assert.deepEqual(shortcut('vscode', 10).k, ['Ctrl', 'F4']);\n  assert.deepEqual(shortcut('vscode', 11).steps, [['Ctrl', 'K'], ['Ctrl', 'W']]);\n  assert.deepEqual(shortcut('vscode', 42).steps, [['Ctrl', 'K'], ['Ctrl', 'F']]);\n});",
              'restore verified VS Code chord assertions',
          )
          verified_path.write_text(verified, encoding='utf-8')
          PY
      - name: Remove one-shot workflow from final tree
        run: rm .github/workflows/one-shot-chord-support.yml
      - name: Verify final tree
        run: npm run check
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: support sequential shortcut chords"
          git push origin HEAD:codex/browser-github-pages
