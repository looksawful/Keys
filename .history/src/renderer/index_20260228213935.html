<!DOCTYPE html>
<html lang="ru" data-theme="arctic-light" data-palette="arctic-white" data-tint="soft">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>keys</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <canvas id="appBackgroundCanvas" class="app-background" aria-hidden="true"></canvas>
    <div id="app">
      <header class="app-header">
        <div class="app-header-inner">
          <div class="app-brand">
            <div class="app-brand-title">keys</div>
            <div class="app-brand-subtitle">Горячие клавиши</div>
          </div>
          <div class="app-dev-tools" id="devTools"></div>
          <nav class="app-nav" id="nav" aria-label="Основная навигация"></nav>
        </div>
      </header>
      <main class="app-main" id="main" aria-label="Содержимое"></main>
      <div id="mroot" role="dialog" aria-modal="true" aria-hidden="true"></div>
    </div>
    <script>
      window.__hkFatal = function (title, details) {
        try {
          const escapeHtml = (value) =>
            String(value).replace(/[&<>"']/g, (ch) => {
              switch (ch) {
                case '&':
                  return '&amp;';
                case '<':
                  return '&lt;';
                case '>':
                  return '&gt;';
                case '"':
                  return '&quot;';
                case "'":
                  return '&#39;';
                default:
                  return ch;
              }
            });
          const msg = (details && String(details)) || '';
          document.body.innerHTML = `
            <div class="fatal-screen">
              <h1 class="fatal-title">${escapeHtml(title)}</h1>
              <p class="fatal-text">
                Приложение не смогло запуститься. Обычно это связано с битым localStorage или ошибкой JS.
              </p>
              <pre class="fatal-details">${escapeHtml(msg)}</pre>
              <button id="hkReset" class="fatal-action">Сбросить данные и перезапустить</button>
            </div>`;
          document.getElementById('hkReset')?.addEventListener('click', () => {
            try {
              localStorage.removeItem('hk_p');
              localStorage.removeItem('hk_s');
              localStorage.removeItem('hk_sh');
              localStorage.removeItem('hk_cfg');
              localStorage.removeItem('hk_sv');
            } catch {}
            location.reload();
          });
        } catch {}
      };
    </script>
    <script src="./data.js"></script>
    <script src="./logic.js"></script>
    <script src="./program-import.js"></script>
    <script src="./program-import-session.js"></script>
    <script src="./background-effects.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
