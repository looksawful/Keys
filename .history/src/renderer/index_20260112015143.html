<!DOCTYPE html>
<html lang="ru" data-theme="arctic-light" data-palette="arctic-white" data-tint="soft">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>keys</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=PT+Sans:wght@400;600;700&family=PT+Mono&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="app">
      <header class="app-header">
        <div class="app-header-inner">
          <div class="app-logo">
            <div class="app-logo-icon">HK</div>
            <span class="app-logo-text">keys</span>
          </div>
          <nav class="app-nav" id="nav"></nav>
        </div>
      </header>
      <main class="app-main" id="main"></main>
      <div id="mroot"></div>
    </div>
    <script>
      // Lightweight error surfacing: renderer code will render a friendly overlay.
      window.__hkFatal = function (title, details) {
        try {
          const msg = (details && String(details)) || '';
          document.body.innerHTML =
            '<div style="padding:32px;font-family:system-ui,Segoe UI,Arial,sans-serif;max-width:900px;margin:0 auto">' +
            '<h1 style="margin:0 0 12px">' +
            title +
            '</h1>' +
            '<p style="margin:0 0 16px;color:#475569">Приложение не смогло запуститься. Обычно это связано с битым localStorage или ошибкой JS.</p>' +
            '<pre style="white-space:pre-wrap;background:#f1f5f9;border:1px solid #e2e8f0;padding:12px;border-radius:8px">' +
            msg +
            '</pre>' +
            '<button id="hkReset" style="margin-top:16px;padding:10px 14px;border-radius:8px;border:1px solid #e2e8f0;background:#fff;cursor:pointer">Сбросить данные и перезапустить</button>' +
            '</div>';
          document.getElementById('hkReset')?.addEventListener('click', () => {
            try {
              localStorage.removeItem('hk_p');
              localStorage.removeItem('hk_s');
              localStorage.removeItem('hk_onb');
              localStorage.removeItem('hk_sh');
            } catch {}
            location.reload();
          });
        } catch {}
      };
    </script>
    <script src="./data.js"></script>
    <script src="./logic.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
